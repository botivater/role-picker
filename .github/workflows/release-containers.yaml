name: Release containers

on:
  push:
    branches-ignore:
      - "main"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      test_tag:
        description: "Optional test tag suffix (defaults to branch name)"
        required: false
        type: string

jobs:
    docker:
        strategy:
            matrix:
                application: ["role-picker"]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v2

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v4
              with:
                  # List of Docker imges to use as base name for tags
                  images: |
                      ghcr.io/botivater/${{ matrix.application }}
                  # Generate Docker tags based on the following events/attributes
                  tags: |
                      type=raw,value=test-${{ inputs.test_tag || github.ref_name }},enable=${{ github.ref_type == 'branch' || github.event_name == 'workflow_dispatch' }}
                      type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
                      type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
                      type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
                      type=sha,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            - name: Setup QEMU
              uses: docker/setup-qemu-action@v2

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v2
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v3
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
